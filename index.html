<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Night Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #clock-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 1s linear, filter 0.2s linear;
  }
  #time {
    color: #fff;
    font-family: -apple-system, "SF Pro Display", Helvetica, Arial, sans-serif;
    font-weight: 300;
    font-size: 24vw;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  #date {
    color: #fff;
    font-family: -apple-system, "SF Pro Display", Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-size: 5vw;
    margin-top: 0.8vh;
    opacity: 0.6;
  }
  #alarm {
    position: fixed;
    right: 4vw;
    bottom: 4vh;
    color: #fff;
    font-family: -apple-system, "SF Pro Display", Helvetica, Arial, sans-serif;
    font-size: 4.4vw;
    opacity: 0.55;
    text-align: right;
    transition: transform 1s linear;
    text-decoration: underline;
    text-decoration-thickness: 2px;
  }
</style>
</head>
<body>
  <div id="clock-wrap">
    <div id="time">--:--</div>
    <div id="date">--</div>
  </div>

  <div id="alarm"></div>

<script>
  // Manual brightness control: edit this number (8-100) directly if you
  // want to change how dim the text is. It's the only "setting" now that
  // the on-screen tap panel has been removed.
  const DEFAULT_BRIGHTNESS = 35;

  const wrap = document.getElementById('clock-wrap');
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const alarmEl = document.getElementById('alarm');

  function pad(n) { return n.toString().padStart(2, '0'); }

  function update() {
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    h = h % 12;
    if (h === 0) h = 12;
    timeEl.textContent = pad(h) + ':' + pad(m);

    const opts = { weekday: 'long', month: 'long', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString(undefined, opts);

    // Tiny pixel shift every minute to help prevent OLED burn-in.
    const shiftX = (now.getMinutes() % 4) * 4 - 6;   // -6..+6 px
    const shiftY = (now.getHours() % 4) * 4 - 6;
    wrap.style.transform = `translate(${shiftX}px, ${shiftY}px)`;

    // The alarm text gets its own shift pattern, offset from the clock's,
    // so the two don't always move in lockstep.
    const alarmShiftX = -((now.getMinutes() % 3) * 3 - 3); // -3..+3 px
    const alarmShiftY = -((now.getHours() % 3) * 3 - 3);
    alarmEl.style.transform = `translate(${alarmShiftX}px, ${alarmShiftY}px)`;

    setTimeout(update, (60 - now.getSeconds()) * 1000);
  }

  function applyBrightness(val) {
    const factor = (val / 100).toFixed(2);
    wrap.style.filter = `brightness(${factor})`;
    alarmEl.style.filter = `brightness(${factor})`;
  }

  // Keeps honoring a brightness level you may have set previously via the
  // old slider (stored in localStorage), otherwise falls back to the
  // constant above.
  const saved = localStorage.getItem('nightclock-brightness');
  applyBrightness(saved || DEFAULT_BRIGHTNESS);

  // Fetch alarm.json (written by your Shortcuts automation) and display it.
  // Cache-busting query param + no-store so we don't show a stale value.
  function loadAlarm() {
    fetch('alarm.json?_=' + Date.now(), { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('not found');
        return res.json();
      })
      .then(data => {
        if (data && data.alarm) {
          alarmEl.textContent = 'Alarm: ' + data.alarm;
        } else {
          alarmEl.textContent = '';
        }
      })
      .catch(() => {
        // File missing, not deployed yet, or offline — fail quietly.
        alarmEl.textContent = '';
      });
  }

  loadAlarm();
  // Re-check periodically in case the page is left open while the
  // automation runs (e.g. charger connects later in the night).
  setInterval(loadAlarm, 60000);

  update();

  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
